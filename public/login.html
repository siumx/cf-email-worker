<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="auth.title">Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="app-container" data-component="login-page">
      <div class="preferences-toolbar" role="group" aria-label="Interface preferences" data-i18n-aria-label="settings.label">
        <label class="preference-field" for="language-select">
          <span id="language-label" data-i18n="settings.language">Language</span>
          <select id="language-select" aria-labelledby="language-label" class="form-input form-select" data-action="change-language" disabled>
            <option>Loading…</option>
          </select>
        </label>
        <label class="preference-field" for="timezone-select">
          <span id="timezone-label" data-i18n="settings.timeZone">Time zone</span>
          <select id="timezone-select" aria-labelledby="timezone-label" class="form-input form-select" data-action="change-timezone" disabled>
            <option>UTC+08:00</option>
          </select>
        </label>
      </div>
      <div class="member-brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span>Email Worker</span></div>
      <header class="page-header"><div><h1 class="page-title" data-i18n="auth.title">Sign in to your mailbox</h1><p class="page-subtitle" data-i18n="auth.subtitle">Read messages and use your mailbox.</p></div></header>
      <div id="load-error" class="status-alert status-alert-danger hidden" role="alert"></div>
      <section class="auth-card" aria-labelledby="login-title">
        <div class="auth-mark" aria-hidden="true">✉</div>
        <h2 id="login-title" data-i18n="auth.welcome">Welcome back</h2>
        <p class="page-subtitle" data-i18n="auth.description">Sign in with your admin or member account.</p>
        <form method="post" id="login-form" class="form-stack" data-action="login">
          <label for="login-prefix" data-i18n="auth.account">Account</label>
          <input id="login-prefix" class="form-input" name="username" autocomplete="username" maxlength="64" required data-i18n-placeholder="auth.accountPlaceholder" placeholder="Enter your account" />
          <label for="login-password" data-i18n="auth.password">Password</label>
          <div class="password-field"><input id="login-password" class="form-input" name="password" type="password" autocomplete="current-password" required data-i18n-placeholder="auth.passwordPlaceholder" placeholder="Enter your password" /><button type="button" class="btn password-toggle" data-action="toggle-password" data-target="login-password" data-i18n-aria-label="auth.showPassword" aria-label="Show password">◉</button></div>
          <p id="auth-error" class="status-alert status-alert-danger hidden" role="alert"></p>
          <button class="btn btn-primary auth-submit" type="submit" disabled data-i18n="auth.signIn">Sign in</button>
        </form>
        <p class="auth-help" data-i18n="auth.help">Forgot your password? Contact your administrator.</p>
      </section>
      <p class="auth-bootstrap" data-i18n="auth.bootstrap">First time? Sign in as admin to create your first member.</p>
    </main>
    <script src="lib/i18next.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
