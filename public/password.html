<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="auth.changePassword">Change password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="app-container" data-component="password-page">
      <div class="preferences-toolbar" role="group" aria-label="Interface preferences" data-i18n-aria-label="settings.label">
        <label class="preference-field" for="language-select">
          <span id="language-label" data-i18n="settings.language">Language</span>
          <select id="language-select" aria-labelledby="language-label" class="form-input form-select" data-action="change-language" disabled>
            <option>Loading…</option>
          </select>
        </label>
        <label class="preference-field" for="timezone-select">
          <span id="timezone-label" data-i18n="settings.timeZone">Time zone</span>
          <select id="timezone-select" aria-labelledby="timezone-label" class="form-input form-select" data-action="change-timezone" disabled>
            <option>UTC+08:00</option>
          </select>
        </label>
      </div>
      <div class="member-brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span>Email Worker</span></div>
      <header class="page-header"><div><h1 class="page-title" data-i18n="auth.changePassword">Change password</h1></div></header>
      <div id="load-error" class="status-alert status-alert-danger hidden" role="alert"></div>
      <section class="auth-card" aria-labelledby="password-title"><h2 id="password-title" data-i18n="auth.changePassword">Change password</h2><p id="password-required" class="page-subtitle hidden" data-i18n="auth.mustChange">Change your initial password before opening your mailbox.</p>
        <form method="post" id="password-form" class="form-stack" data-action="change-password">
          <label for="current-password" data-i18n="auth.currentPassword">Current password</label><input id="current-password" class="form-input" type="password" autocomplete="current-password" required />
          <label for="new-password" data-i18n="auth.newPassword">New password</label><input id="new-password" class="form-input" type="password" autocomplete="new-password" required />
          <label for="confirm-password" data-i18n="auth.confirmPassword">Confirm password</label><input id="confirm-password" class="form-input" type="password" autocomplete="new-password" required />
          <p id="auth-error" class="status-alert status-alert-danger hidden" role="alert"></p><button class="btn btn-primary auth-submit" type="submit" disabled data-i18n="auth.savePassword">Save password</button>
        </form>
      </section>
    </main>
    <script src="lib/i18next.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
