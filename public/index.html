<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="inbox.pageTitle">Inbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="app-container" data-component="inbox-page">
      <div class="preferences-toolbar" role="group" aria-label="Interface preferences" data-i18n-aria-label="settings.label">
        <label class="preference-field" for="language-select">
          <span id="language-label" data-i18n="settings.language">Language</span>
          <select id="language-select" aria-labelledby="language-label" class="form-input form-select" data-action="change-language" disabled>
            <option>Loading…</option>
          </select>
        </label>
        <label class="preference-field" for="timezone-select">
          <span id="timezone-label" data-i18n="settings.timeZone">Time zone</span>
          <select id="timezone-select" aria-labelledby="timezone-label" class="form-input form-select" data-action="change-timezone" disabled>
            <option>UTC+08:00</option>
          </select>
        </label>
      </div>

      <header class="page-header" data-component="header-toolbar">
        <div>
          <h1 class="page-title" data-i18n="inbox.title">Inbox</h1>
          <p class="page-subtitle" data-i18n="inbox.subtitle">Your latest messages</p>
        </div>

        <div class="toolbar">
          <div class="toolbar-group" role="group" aria-label="Refresh controls" data-i18n-aria-label="inbox.refreshControls">
            <div class="countdown-chip">
              <span id="refresh-timer" data-i18n="inbox.refreshPaused">Auto refresh is off</span>
            </div>
            <button
              id="auto-refresh-toggle" data-action="toggle-refresh"
              type="button"
              class="btn"
              aria-pressed="false"
              title="Toggle auto refresh" data-i18n-title="inbox.autoRefreshTitle"
              data-i18n="inbox.off"
            >
              Off
            </button>
            <button
              id="manual-refresh-btn" data-action="refresh"
              type="button"
              class="btn"
              title="Refresh the list now" data-i18n-title="inbox.refreshNow"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                <path d="M16 21h5v-5" />
              </svg>
              <span data-i18n="inbox.refresh">Refresh</span>
            </button>
          </div>

          <button id="compose-btn" data-action="compose-open" type="button" class="btn btn-primary" disabled title="Loading sender settings" data-i18n-title="compose.loadingConfig">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
            </svg>
            <span data-i18n="inbox.compose">Compose</span>
          </button>
        </div>
      </header>

      <div class="search-wrap" data-component="search-bar">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <label class="visually-hidden" for="search-q" data-i18n="inbox.search">Search subject, sender or recipient</label>
        <input
          id="search-q" data-action="search"
          name="q"
          type="search"
          autocomplete="off"
          maxlength="200"
          placeholder="Search subject, sender or recipient…" data-i18n-placeholder="inbox.searchPlaceholder"
          class="search-input"
        />
      </div>

      <div id="load-error" class="status-alert status-alert-danger hidden" role="alert"></div>

      <div id="list-region" aria-live="polite" data-component="mail-list">
        <ul id="list" class="mail-list"></ul>

        <div id="empty" class="empty-state hidden">
          <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="20" height="16" x="2" y="4" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
          <p class="empty-state-title" data-i18n="inbox.emptyTitle">No messages yet</p>
          <p class="empty-state-text" data-i18n="inbox.emptyText">Refresh later or try a different search.</p>
        </div>
      </div>

      <nav id="pagination" class="pagination" aria-label="Message pages" data-i18n-aria-label="inbox.pagination" data-component="pagination">
        <button id="prev-btn" data-action="previous-page" type="button" class="btn" disabled data-i18n="inbox.previous">Previous</button>
        <span id="page-indicator" class="page-indicator" data-i18n="inbox.page" data-i18n-params='{"page":1,"total":1}'>Page 1 of 1</span>
        <button id="next-btn" data-action="next-page" type="button" class="btn" disabled data-i18n="inbox.next">Next</button>
      </nav>
    </main>

    <div id="compose-backdrop" data-action="compose-backdrop" class="compose-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="compose-title" data-component="compose-modal">
      <div class="compose-modal" role="document">
        <header class="compose-header">
          <h2 id="compose-title" class="compose-title" data-i18n="compose.title">Compose a message</h2>
          <button id="compose-close" data-action="compose-close" type="button" class="btn btn-icon" aria-label="Close" data-i18n-aria-label="common.close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </header>

        <form id="compose-form" data-action="send-mail" class="compose-body">
          <div class="form-stack">
            <div class="form-row-inline">
              <div class="form-row form-row-flex">
                <label for="compose-from-local"><span data-i18n="common.from">From</span> <span aria-label="Required" data-i18n-aria-label="common.required">*</span></label>
                <div class="from-address">
                  <input id="compose-from-local" type="text" class="form-input" placeholder="you" autocomplete="username" required />
                  <span class="from-at" aria-hidden="true">@</span>
                  <select id="compose-from-domain" class="form-input form-select" aria-label="Sender domain" data-i18n-aria-label="compose.fromDomain" required disabled></select>
                </div>
              </div>
              <div class="form-row form-row-flex">
                <label for="compose-name" data-i18n="compose.name">Display name</label>
                <input id="compose-name" type="text" class="form-input" placeholder="Your name" data-i18n-placeholder="compose.namePlaceholder" />
              </div>
            </div>

            <div class="form-row">
              <label for="compose-to"><span data-i18n="common.to">To</span> <span aria-label="Required" data-i18n-aria-label="common.required">*</span></label>
              <input id="compose-to" type="email" class="form-input" placeholder="recipient@example.com" required />
            </div>

            <div class="form-row">
              <label for="compose-cc" data-i18n="compose.cc">Cc</label>
              <input id="compose-cc" type="text" class="form-input" placeholder="cc@example.com, …" />
            </div>

            <div class="form-row">
              <label for="compose-bcc" data-i18n="compose.bcc">Bcc</label>
              <input id="compose-bcc" type="text" class="form-input" placeholder="bcc@example.com, …" />
            </div>

            <div class="form-row">
              <label for="compose-subject" data-i18n="compose.subject">Subject</label>
              <input id="compose-subject" type="text" class="form-input" placeholder="Message subject" data-i18n-placeholder="compose.subjectPlaceholder" />
            </div>

            <div class="form-row">
              <label for="compose-body" data-i18n="compose.body">Message</label>
              <textarea id="compose-body" class="form-textarea" placeholder="Write your message here…" data-i18n-placeholder="compose.bodyPlaceholder"></textarea>
            </div>

            <div class="form-row">
              <label data-i18n="common.attachments">Attachments</label>
              <div id="drop-zone" data-action="choose-attachments" class="drop-zone" tabindex="0" role="button" aria-label="Drop files here or click to attach" data-i18n-aria-label="compose.dropFiles">
                <p class="drop-zone-text" data-i18n="compose.dropFiles">Drop files here or click to attach</p>
              </div>
              <input id="attachment-input" data-action="add-attachments" class="drop-zone-input" type="file" multiple />
              <p class="form-hint" data-i18n="compose.attachmentHint">You can attach multiple files.</p>
              <ul id="attachment-list" class="attachment-list"></ul>
            </div>
          </div>
        </form>

        <footer class="compose-footer">
          <button id="compose-cancel" data-action="compose-close" type="button" class="btn" data-i18n="common.cancel">Cancel</button>
          <button id="compose-submit" type="submit" class="btn btn-primary" form="compose-form" disabled><span class="btn-spinner hidden" aria-hidden="true"></span><span id="compose-submit-label" data-i18n="compose.send">Send</span></button>
        </footer>
      </div>
    </div>

    <script src="lib/i18next.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
