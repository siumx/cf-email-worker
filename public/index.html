<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email Inbox Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="app-container" data-component="inbox-page">
      <header class="page-header" data-component="header-toolbar">
        <div>
          <h1 class="page-title">信箱</h1>
          <p class="page-subtitle">最新收到的郵件</p>
        </div>

        <div class="toolbar">
          <div class="toolbar-group" role="group" aria-label="刷新控制">
            <div class="countdown-chip">
              自動刷新
              <strong id="refresh-timer">30</strong>
              秒
            </div>
            <button
              id="auto-refresh-toggle"
              type="button"
              class="btn"
              aria-pressed="false"
              title="切換自動刷新"
            >
              已關閉
            </button>
            <button
              id="manual-refresh-btn"
              type="button"
              class="btn"
              title="立即刷新列表"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                <path d="M16 21h5v-5" />
              </svg>
              刷新
            </button>
          </div>

          <button id="compose-btn" type="button" class="btn btn-primary" disabled title="載入發件設定中">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
            </svg>
            發件
          </button>
        </div>
      </header>

      <div class="search-wrap" data-component="search-bar">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <label class="visually-hidden" for="search-q">搜尋主旨或收件人</label>
        <input
          id="search-q"
          name="q"
          type="search"
          autocomplete="off"
          maxlength="200"
          placeholder="搜尋主旨或收件人…"
          class="search-input"
        />
      </div>

      <div id="load-error" class="status-alert status-alert-danger hidden" role="alert"></div>


      <div id="list-region" aria-live="polite" data-component="mail-list">
        <ul id="list" class="mail-list"></ul>

        <div id="empty" class="empty-state hidden">
          <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="20" height="16" x="2" y="4" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
          <p class="empty-state-title">目前沒有郵件</p>
          <p class="empty-state-text">稍後刷新，或調整搜尋條件。</p>
        </div>
      </div>

      <nav id="pagination" class="pagination" aria-label="郵件分頁" data-component="pagination">
        <button id="prev-btn" type="button" class="btn" disabled>上一頁</button>
        <span id="page-indicator" class="page-indicator">第 1 / 1 頁</span>
        <button id="next-btn" type="button" class="btn" disabled>下一頁</button>
      </nav>
    </main>

    <div id="compose-backdrop" class="compose-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="compose-title" data-component="compose-modal">
      <div class="compose-modal" role="document">
        <header class="compose-header">
          <h2 id="compose-title" class="compose-title">撰寫新郵件（我自用的，別試了）</h2>
          <button id="compose-close" type="button" class="btn btn-icon" aria-label="關閉">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </header>

        <form id="compose-form" class="compose-body">
          <div class="form-stack">
            <div class="form-row-inline">
              <div class="form-row form-row-flex">
                <label for="compose-from-local">寄件者 <span aria-label="必要">*</span></label>
                <div class="from-address">
                  <input id="compose-from-local" type="text" class="form-input" placeholder="you" autocomplete="username" required />
                  <span class="from-at" aria-hidden="true">@</span>
                  <select id="compose-from-domain" class="form-input form-select" aria-label="寄件者域名" required disabled></select>
                </div>
              </div>
              <div class="form-row form-row-flex">
                <label for="compose-name">顯示名稱</label>
                <input id="compose-name" type="text" class="form-input" placeholder="Your Name" />
              </div>
            </div>

            <div class="form-row">
              <label for="compose-to">收件者 <span aria-label="必要">*</span></label>
              <input id="compose-to" type="email" class="form-input" placeholder="recipient@example.com" required />
            </div>

            <div class="form-row">
              <label for="compose-cc">副本 Cc</label>
              <input id="compose-cc" type="text" class="form-input" placeholder="cc@example.com, …" />
            </div>

            <div class="form-row">
              <label for="compose-bcc">密件副本 Bcc</label>
              <input id="compose-bcc" type="text" class="form-input" placeholder="bcc@example.com, …" />
            </div>

            <div class="form-row">
              <label for="compose-subject">主旨</label>
              <input id="compose-subject" type="text" class="form-input" placeholder="郵件主旨" />
            </div>

            <div class="form-row">
              <label for="compose-body">內文</label>
              <textarea id="compose-body" class="form-textarea" placeholder="在這裡輸入郵件內文…"></textarea>
            </div>

            <div class="form-row">
              <label>附件</label>
              <div id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-label="拖曳檔案至此或點擊選擇附件">
                <p class="drop-zone-text">拖曳檔案至此，或點擊選擇附件</p>
              </div>
              <input id="attachment-input" class="drop-zone-input" type="file" multiple />
              <p class="form-hint">支援多個檔案；送出時會轉為 base64。</p>
              <ul id="attachment-list" class="attachment-list"></ul>
            </div>
          </div>
        </form>

        <footer class="compose-footer">
          <button id="compose-cancel" type="button" class="btn">取消</button>
          <button id="compose-submit" type="submit" class="btn btn-primary" form="compose-form" disabled>送出</button>
        </footer>
      </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
